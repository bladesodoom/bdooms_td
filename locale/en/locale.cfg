[item-description]
biter-essence=Organic residue left behind by slain biters. Queue an Essence Research technology and it's spent straight from your inventory, no lab needed - or refine it into Essence Science Packs for other research.
essence-science-pack=Derived from the remains of fallen enemies. Required by certain military research alongside standard science packs.
td-rapid-rounds=Fast-cycling, low-damage rounds for the Rapid Turret.
td-explosive-compound=Unstable compound refined from iron, copper, and coal. The base ingredient for mortar shells.
td-mortar-shell=High-explosive shell that detonates on impact, dealing area damage. Required by the Mortar Turret.
td-sniper-round=Dense, high-caliber round for the Sniper Turret. Expensive to produce but devastating per shot.
td-rapid-rounds-mk2=Improved Rapid Rounds with 50% more damage. Costs steel to produce.
td-rapid-rounds-ap=Armor-Piercing Rapid Rounds. Maximum damage with a slight range bonus. The premium Rapid Turret option.
td-mortar-shell-wide=Wide-burst mortar shell. 1.8x splash radius, 30% less damage per hit. Ideal for clearing dense swarm clusters.
td-mortar-shell-heavy=High-explosive mortar shell. Double the damage of standard shells at the same radius. Built for elite targets.
td-sniper-round-long=Extended-range sniper round. Same damage as standard, but extends the Sniper Turret's range to 56 tiles. Built for picking off nests and worms safely.
td-sniper-round-ap=Armor-piercing sniper round. Double damage with a range bonus. The endgame Sniper Turret round.
td-shotgun-shell=Basic pellet-spread shell for the Shotgun Turret. Devastating up close, weak at range.
td-shotgun-shell-piercing=Piercing Shotgun Shell with higher per-pellet damage. Costs steel to produce.
td-shotgun-shell-buckshot=Wide-spread buckshot. 50% more pellets, 30% less damage per pellet. Built for swarms that get in close.

