[mod-setting-description]
td-core-max-health=Maximum HP of the Core. Requires restart.
td-boss-base-health=HP of the first boss. Subsequent bosses gain td-boss-health-growth HP each wave, regardless of boss type. Should stay under bdooms_enemies' Boss Max Health Cap.
td-boss-health-growth=HP added to each boss's health per boss wave. Default: 500.
td-initial-essence-cost=Biter Essence (or Essence Science Pack, for lab tiers) cost of tier 1 in each essence research chain. Later tiers scale up by td-essence-cost-multiplier per tier. Requires restart.
td-essence-cost-multiplier=How much each tier's cost multiplies over the previous tier's, e.g. 2 doubles the cost every tier. Applies to every tier, essence-funded or lab. Requires restart.
td-essence-technology-count=Number of tiers in each of the 5 essence research chains (wave interval, wave size, biter health, attack speed, damage). Set to 0 to disable a fresh save's essence research entirely. Requires restart.
td-science-pack-starting-tier=The first tier in each chain that requires lab research instead of being paid directly from Biter Essence in your inventory. Tiers before this are essence-funded; tiers from this tier onward need a lab, layering on one more vanilla science pack per tier. Requires restart.
td-essence-bonus-initial=Stat bonus (as a fraction, e.g. 0.08 = 8%) granted by tier 1 of every essence research chain. Requires restart.
td-essence-bonus-growth=Multiplier applied to the tier bonus each subsequent tier, e.g. 1.25 grows each tier's bonus by 25% over the last. Requires restart.
td-wave-interval-seconds=Seconds between waves. Default: 600 (10 minutes).
td-base-wave-size=Number of enemies in the first wave.
td-wave-size-growth=Additional enemies added to each subsequent wave.
td-boss-interval=A boss wave spawns every N waves. Default: 10.
td-aura-radius=Radius in tiles of the Core damage aura. Default: 48.
td-aura-damage=Laser damage dealt per second to enemies in the aura. Default: 1.
