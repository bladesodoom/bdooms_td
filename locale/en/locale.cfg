[entity-description]
td-core=Your objective. A laser turret in its own right - 5x5 tiles, weaker than a standard laser turret. Needs no ammo and no power lines. If it falls, the game ends.
td-rapid-turret=A fast-firing, low-damage turret. Excels against single tough targets. Struggles against swarms.
td-mortar-turret=A slow-firing turret with high area damage. Clears swarm biters efficiently. Less effective against armored single targets.
td-sniper-turret=An extremely long-range, slow-firing turret with very high per-shot damage. Picks off elite targets before other turrets can reach them.
td-shotgun-turret=A very short-range turret that fires a pellet spread per shot. Devastating against biters that get in close. Wasted on distant targets.
td-swarm-biter=A tiny, fast biter that arrives in dense clusters. Easy to kill individually but overwhelming in numbers. Vulnerable to area damage.
td-tank-biter=A heavily armoured biter with massive HP and very slow movement. Rapid fire is nearly useless against it. Sniper AP rounds are the most efficient counter.
td-swarm-lord=The Swarm Lord. Appears on boss waves once evolution requirements allow it. Extremely durable with multi-layered resistances. Spawns swarm biter clusters 5 seconds after appearing and every 5 seconds thereafter. Health scales with each boss wave. Drops large amounts of Biter Essence on death.
td-hive-lord=The Hive Lord. Appears on boss waves once evolution is high enough. A tanky turtler that drops a biter nest 60 seconds after appearing and every 60 seconds thereafter - the nest keeps producing biters on its own until destroyed. Health scales with each boss wave. Drops large amounts of Biter Essence on death.
td-hive-nest=A biter nest dropped by the Hive Lord. Passively produces biters over time. Destroy it to stop the reinforcements.

